<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viaje compartido</title>
<meta name="description" content="Seguí en vivo un viaje compartido.">
<meta name="theme-color" content="#0b3d91">
<meta name="robots" content="noindex">
<link rel="icon" href="../icono-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--azul:#0b3d91;--celeste:#e8f1fd;--borde:#d6e2f3;--texto:#14233d;--suave:#5b6b85;--verde:#1e8449}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--texto);display:flex;flex-direction:column;background:#f3f7fc}
header{background:linear-gradient(135deg,#1f6fe0,var(--azul) 60%,#06275f);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;flex:none}
header img{width:38px;height:38px;border-radius:50%;background:#fff}
header b{display:block;font-size:16px}header small{opacity:.88;font-size:13px}
#mapa{flex:1;min-height:260px;background:#dfe8f3}
.panel{flex:none;background:#fff;border-top:1px solid var(--borde);padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(11,61,145,.08)}
.est{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px}
.punto{width:12px;height:12px;border-radius:50%;background:var(--verde);flex:none;animation:lat 1.2s infinite}
.punto.gris{background:#9aa8bd;animation:none}
@keyframes lat{0%{box-shadow:0 0 0 0 rgba(30,132,73,.6)}100%{box-shadow:0 0 0 12px rgba(30,132,73,0)}}
.det{color:var(--suave);font-size:14px;margin-top:4px;line-height:1.4}
.llego{background:#eaf7ef;border:1px solid #bfe5cc;color:#145a32;border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px;margin-bottom:8px}
.acc{display:flex;gap:8px;margin-top:10px}
.acc a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:14px;border-radius:12px;padding:11px 8px;background:var(--celeste);color:var(--azul)}
.hidden{display:none!important}
.fin{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--suave);line-height:1.5}
.fin b{display:block;color:var(--texto);font-size:19px;margin:8px 0 4px}
.movp{display:flex;align-items:center;gap:10px;background:#f5f9ff;border:1.5px solid #9cc3f5;border-radius:14px;padding:8px 10px;margin-top:8px}
.movp .nm{background:#0b3d91;color:#fff;border-radius:10px;padding:5px 9px;text-align:center;line-height:1}.movp .nm small{display:block;font-size:10px;opacity:.85}.movp .nm b{font-size:20px}
.movp .pt{border:2.5px solid #14233d;border-radius:7px;background:#fff;padding:3px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:19px;letter-spacing:.05em}
.movp span.tx{font-size:12.5px;color:#5b6b85;line-height:1.3}
.auto{width:22px;height:22px;border-radius:50%;background:#1f6fe0;border:4px solid #fff;box-shadow:0 0 0 2px rgba(31,111,224,.35),0 2px 6px rgba(0,0,0,.35)}
</style>
</head>
<body>
<header><span style="width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none">📍</span><div><b id="tit">Viaje compartido</b><small id="sub">Seguimiento en vivo</small></div></header>
<div id="mapa"></div>
<div class="panel" id="panel">
  <div class="llego hidden" id="llego"></div>
  <div class="est"><span class="punto" id="pto"></span><span id="est">Cargando…</span></div>
  <div class="movp hidden" id="movp"><div class="nm"><small>MÓVIL</small><b id="pMov"></b></div><span class="pt hidden" id="pPat"></span><span class="tx">Auto que indicó al empezar el viaje</span></div>
  <div class="det" id="det"></div>
  <div class="acc"><a id="gm" href="#" target="_blank" rel="noopener">🗺️ Abrir en Google Maps</a><a href="tel:+543414380000">📞 Pedir un taxi</a></div>
  <div style="text-align:center;font-size:12px;color:#5b6b85;margin-top:8px">Servicio gratuito de <b>Taxi 380mil</b> · Rosario</div>
</div>
<div class="fin hidden" id="fin"><div>🚕<b id="finT">Este seguimiento terminó</b>Ya no se comparte la ubicación de este viaje.<br><br><a href="tel:+543414380000" style="color:#0b3d91;font-weight:700">¿Necesitás un taxi? 341 4-380.000</a></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const SB = "https://muemdhlrsjlmxvfraljp.supabase.co/rest/v1/rpc/", KEY = "sb_publishable_WMpo3vPv2NDR5Ms_QEDHyQ_ATzkn46l";
const $ = id => document.getElementById(id);
const esc = s => String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rpc = (fn, b) => fetch(SB + fn, {method:"POST", headers:{apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json"}, body:JSON.stringify(b)}).then(r => r.json());
const ID = (new URLSearchParams(location.search).get("v") || "").replace(/[^a-f0-9]/g,"").slice(0,40);
const fmtPat = p => { p = String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,""); return /^[A-Z]{2}\d{3}[A-Z]{2}$/.test(p) ? p.slice(0,2)+" "+p.slice(2,5)+" "+p.slice(5) : /^[A-Z]{3}\d{3}$/.test(p) ? p.slice(0,3)+" "+p.slice(3) : p; };
const hora = t => new Date(t).toLocaleTimeString("es-AR", {hour:"2-digit", minute:"2-digit", hour12:false});
let mapa = null, linea = null, marca = null, siguiendo = true, centrado = false, desfase = 0, ult = null, tmr = null;

function iniMapa(){
  if(mapa || !window.L) return;
  mapa = L.map("mapa", {zoomControl:true}).setView([-32.9468, -60.6393], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(mapa);
  linea = L.polyline([], {color:"#1f6fe0", weight:5, opacity:.8}).addTo(mapa);
  marca = L.marker([-32.9468, -60.6393], {icon:L.divIcon({className:"", html:'<div class="auto"></div>', iconSize:[22,22], iconAnchor:[11,11]})});
  mapa.on("dragstart", () => siguiendo = false);
}
function terminado(nombre){ clearInterval(tmr); $("mapa").classList.add("hidden"); $("panel").classList.add("hidden"); $("fin").classList.remove("hidden");
  if(nombre) $("finT").textContent = "El viaje de " + nombre + " ya no se comparte"; }

function pintarEstado(){
  if(!ult) return;
  const d = ult;
  if(d.llego_en){ $("pto").classList.add("gris"); $("est").textContent = "Viaje terminado"; return; }
  if(!d.actualizado){ $("est").textContent = "Esperando la primera ubicación…"; return; }
  const s = Math.max(0, Math.round((Date.now() + desfase - new Date(d.actualizado)) / 1000));
  const viejo = s > 90; $("pto").classList.toggle("gris", viejo);
  $("est").textContent = !viejo ? "En viaje · ubicación en vivo" : "Última ubicación hace " + (s < 3600 ? Math.round(s/60) + " min" : "más de 1 h");
  if(d.movil){ $("pMov").textContent = d.movil; $("movp").classList.remove("hidden"); if(d.patente){ $("pPat").textContent = fmtPat(d.patente); $("pPat").classList.remove("hidden"); } }
  $("det").innerHTML = [d.destino ? "Va hacia: <b>" + esc(d.destino) + "</b>" : "", "Salió " + hora(d.creado)].filter(Boolean).join(" · ")
    + (viejo ? "<br>Puede tener la pantalla bloqueada o estar sin señal. Se actualiza solo." : "");
}
async function cargar(){
  if(!ID){ terminado(); return; }
  let d; try{ d = await rpc("viaje_ver", {p_id:ID}); }catch(e){ $("est").textContent = "Sin conexión, reintentando…"; return; }
  if(!d || d.error){ terminado(d && d.nombre); return; }
  ult = d; if(d.ahora) desfase = new Date(d.ahora) - Date.now();
  $("tit").textContent = d.nombre ? d.nombre + " está compartiendo su viaje" : "Viaje compartido";
  $("sub").textContent = "Seguimiento en vivo";
  document.title = "Viaje de " + (d.nombre || "") + " · en vivo";
  iniMapa();
  const P = d.puntos || [];
  if(mapa && P.length){
    linea.setLatLngs(P); const ul = P[P.length-1]; marca.setLatLng(ul); if(!mapa.hasLayer(marca)) marca.addTo(mapa);
    if(!centrado){ centrado = true; P.length > 1 ? mapa.fitBounds(linea.getBounds(), {padding:[40,40], maxZoom:16}) : mapa.setView(ul, 16); }
    else if(siguiendo) mapa.panTo(ul);
    $("gm").href = "https://www.google.com/maps/search/?api=1&query=" + ul[0] + "," + ul[1];
  }
  if(d.llego_en){ $("llego").innerHTML = "✅ " + esc(d.nombre || "Llegó") + (d.nombre ? " avisó que llegó bien" : " bien") + " a las " + hora(d.llego_en); $("llego").classList.remove("hidden"); clearInterval(tmr); }
  pintarEstado();
}
cargar(); tmr = setInterval(cargar, 8000); setInterval(pintarEstado, 5000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && ult && !ult.llego_en) cargar(); });
</script>
</body>
</html>
